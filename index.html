<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Write a line per slide, then run the talk from a ring that shows what you say, what is next, and how far behind you are.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F7F6F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C0C0B" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Slide Clock">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon.png" sizes="32x32">
<style>
html{color-scheme:light dark}
body{margin:0;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
img{max-width:100%}
[hidden]{display:none!important}
/* installed on a phone, the status bar sits over the page */
@media (display-mode: standalone){
  .masthead{padding-top:calc(22px + env(safe-area-inset-top,0px))}
}
/* iOS gives a web app no install prompt of its own, so the page has to say how */
#install{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(88px + env(safe-area-inset-bottom,0px));
  z-index:40;width:min(calc(100% - 28px),380px);
  display:flex;align-items:center;gap:10px;
  padding:12px 14px;border-radius:16px;
  background:var(--glass,rgba(255,255,255,.8));
  -webkit-backdrop-filter:blur(20px) saturate(170%);
  backdrop-filter:blur(20px) saturate(170%);
  border:1px solid var(--glass-edge,rgba(0,0,0,.1));
  box-shadow:var(--shadow,0 10px 30px -14px rgba(0,0,0,.4));
  font-size:13.5px;line-height:1.4;color:var(--ink,#111);
}
#install b{font-weight:600}
#install-go{
  flex-shrink:0;border:0;border-radius:99px;cursor:pointer;
  background:var(--accent,#E8462A);color:var(--accent-ink,#fff);
  font-size:13px;font-weight:600;padding:7px 14px;
}
#install-x{
  margin-left:auto;flex-shrink:0;border:0;background:transparent;
  color:var(--ink-3,#888);font-size:18px;line-height:1;cursor:pointer;padding:4px 2px;
}
</style>
<title>Slide Clock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;500;600&display=swap">

<style>
:root{
  --paper:#F7F6F3; --card:#FFFFFF; --ink:#111110; --ink-2:#5C5C57; --ink-3:#95948D;
  --rule:#E2E0DA; --rule-2:#EDEBE6;
  --accent:#E8462A; --accent-ink:#FFF6F3; --accent-soft:#FBEAE5;
  --ok:#1F7A4D; --ok-soft:#E4F1EA;
  --warn:#B4740B; --warn-soft:#FAF0DC;
  --glass:rgba(255,255,255,.70);
  --glass-edge:rgba(17,17,16,.10);
  --glass-top:rgba(255,255,255,.65);
  --shadow:0 10px 34px -14px rgba(17,17,16,.42);
  --radius:16px;
  --display:"Archivo",-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei","Segoe UI",sans-serif;
  --sans:"Public Sans",-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei","Segoe UI",sans-serif;
  --mono:"IBM Plex Mono","SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0C0C0B; --card:#161615; --ink:#F4F3EF; --ink-2:#A6A59E; --ink-3:#747369;
    --rule:#2A2A27; --rule-2:#1F1F1D;
    --accent:#FF5A3C; --accent-ink:#1A0A06; --accent-soft:#2A1410;
    --ok:#4FBE86; --ok-soft:#12291E;
    --warn:#E0A63F; --warn-soft:#2C2214;
    --glass:rgba(30,30,28,.66);
    --glass-edge:rgba(255,255,255,.12);
    --glass-top:rgba(255,255,255,.10);
    --shadow:0 10px 34px -14px rgba(0,0,0,.75);
  }
}
:root[data-theme="dark"]{
  --paper:#0C0C0B; --card:#161615; --ink:#F4F3EF; --ink-2:#A6A59E; --ink-3:#747369;
  --rule:#2A2A27; --rule-2:#1F1F1D;
  --accent:#FF5A3C; --accent-ink:#1A0A06; --accent-soft:#2A1410;
  --ok:#4FBE86; --ok-soft:#12291E;
  --warn:#E0A63F; --warn-soft:#2C2214;
  --glass:rgba(30,30,28,.66);
  --glass-edge:rgba(255,255,255,.12);
  --glass-top:rgba(255,255,255,.10);
  --shadow:0 10px 34px -14px rgba(0,0,0,.75);
}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
input,textarea{font:inherit;color:inherit}

.wrap{max-width:620px;margin:0 auto;padding:0 18px 124px;display:flex;flex-direction:column;gap:22px}
body.presenting{overflow:hidden}
body.presenting .wrap{padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
.masthead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:22px 0 0}
.mark{font-family:var(--display);font-weight:800;font-size:17px;letter-spacing:-.03em}
.mark span{color:var(--accent)}
.mark em{font-family:var(--mono);font-style:normal;font-size:9.5px;font-weight:400;letter-spacing:.06em;color:var(--ink-3);margin-left:7px;vertical-align:2px}
.langsel{display:flex;gap:2px;padding:2px;border:1px solid var(--rule);border-radius:99px;background:var(--card)}
.langsel button{
  border:0;background:transparent;border-radius:99px;cursor:pointer;
  padding:5px 11px;font-size:12px;font-weight:600;color:var(--ink-3);line-height:1.2;
}
.langsel button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

h2{font-family:var(--display);font-weight:800;font-size:clamp(28px,7.6vw,38px);letter-spacing:-.04em;line-height:1.03;margin:0;text-wrap:balance}
.sub{margin:0;color:var(--ink-2);font-size:15.5px;line-height:1.5;max-width:46ch}
.panel-head{display:flex;flex-direction:column;gap:10px}
section.step{display:flex;flex-direction:column;gap:24px}
.lab{font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.field{display:flex;flex-direction:column;gap:10px}
.hint{font-size:14.5px;color:var(--ink-2);line-height:1.5}

.bigfield{width:100%;background:transparent;border:0;border-bottom:2px solid var(--rule);padding:6px 0 10px;font-family:var(--display);font-weight:700;font-size:clamp(20px,5.4vw,26px);letter-spacing:-.025em;line-height:1.2}
.bigfield::placeholder{color:var(--ink-3);font-weight:600}
.bigfield:focus-visible{outline:0;border-bottom-color:var(--accent)}
textarea{width:100%;background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:12px 13px;font-size:16px;line-height:1.5;resize:vertical;min-height:80px}
textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}

.pillrow{display:flex;gap:7px;flex-wrap:wrap}
.pill{font-family:var(--mono);font-size:13.5px;padding:9px 14px;border-radius:99px;border:1px solid var(--rule);background:var(--card);cursor:pointer;white-space:nowrap}
.pill[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}

.stepper{display:flex;align-items:center;gap:14px}
.stepbtn{width:52px;height:52px;border-radius:99px;border:1px solid var(--rule);background:var(--card);font-size:24px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
.stepbtn:disabled{opacity:.3;cursor:not-allowed}
.stepval{font-family:var(--display);font-weight:800;font-size:clamp(46px,13vw,64px);letter-spacing:-.05em;line-height:1;font-variant-numeric:tabular-nums;min-width:2.2ch;text-align:center}
.stepunit{font-family:var(--mono);font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}

/* ---------- rehearsal ---------- */
.recbtn{
  width:40px;height:40px;border-radius:99px;border:1px solid var(--rule);
  background:transparent;cursor:pointer;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
}
.recdot{width:13px;height:13px;border-radius:99px;background:var(--ink-3)}
.recbtn[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.recbtn[aria-pressed="true"] .recdot{background:var(--accent)}
.recbtn.live{border-color:var(--accent);background:var(--accent-soft)}
.recbtn.live .recdot{background:var(--accent);animation:recpulse 1.4s ease-in-out infinite}
@keyframes recpulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.72)}}

.recchip{
  display:inline-flex;align-items:center;gap:7px;align-self:flex-start;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--accent);background:var(--accent-soft);
  border:1px solid var(--accent);border-radius:99px;padding:5px 11px;
}
.recchip .recdot{width:9px;height:9px;animation:recpulse 1.4s ease-in-out infinite}
.rplay{
  width:34px;height:34px;border-radius:99px;flex-shrink:0;
  border:1px solid var(--rule);background:var(--card);cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--ink-2);
}
.rplay:disabled{opacity:.3;cursor:not-allowed}
.rrow[aria-current="true"] .rplay{border-color:var(--accent);color:var(--accent)}
.review{display:flex;flex-direction:column;gap:14px}
.rsum{
  border:1px solid var(--rule);border-radius:var(--radius);
  background:var(--card);padding:15px 16px;display:flex;flex-direction:column;gap:4px;
}
.rsum .k{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.rsum .v{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:-.035em}
.rsum.over .v{color:var(--accent)}
.rrows{display:flex;flex-direction:column;border-top:1px solid var(--rule)}
.rrow{
  display:flex;align-items:center;gap:11px;width:100%;
  padding:12px 4px;border:0;border-bottom:1px solid var(--rule);
  background:transparent;cursor:pointer;text-align:left;
}
.rrow:hover{background:var(--rule-2)}
.rrow[aria-current="true"]{background:var(--accent-soft)}
.rn{font-family:var(--mono);font-size:12px;color:var(--ink-3);min-width:2.4ch;flex-shrink:0}
.rt{flex:1;min-width:0;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rtimes{font-family:var(--mono);font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums;flex-shrink:0}
.rdelta{font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums;flex-shrink:0;min-width:6ch;text-align:right}
.rdelta.over{color:var(--accent);font-weight:500}
.rdelta.under{color:var(--ok)}
.rbar{height:5px;border-radius:99px;background:var(--rule-2);overflow:hidden;display:flex;margin-top:5px}
.rbar i{display:block;height:100%}
.rbar .plan{background:var(--ink-3)}
.rbar .act{background:var(--accent)}
audio{width:100%;margin-top:2px}

/* ---------- import ---------- */
.importrow{display:flex;flex-direction:column;gap:9px}
.filebtn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border:1px dashed var(--ink-3);background:transparent;color:var(--ink);
  border-radius:99px;padding:13px 20px;cursor:pointer;font-size:16px;font-weight:600;
  width:100%;
}
.filebtn:hover{border-color:var(--accent);color:var(--accent)}
.filebtn input{display:none}
.importmsg{font-size:14.5px;line-height:1.5;color:var(--ink-2)}
.importmsg.bad{color:var(--accent)}
.wthumb{
  width:100%;border-radius:10px;border:1px solid var(--rule);
  display:block;background:var(--paper);
}

/* ---------- budget ---------- */
.budget{position:sticky;top:0;z-index:4;background:var(--paper);padding:12px 0 14px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--rule)}
.budget-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.budget-fig{font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums}
.budget-state{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:99px}
.budget-state.ok{background:var(--ok-soft);color:var(--ok)}
.budget-state.over{background:var(--accent-soft);color:var(--accent)}
.budget-track{height:8px;border-radius:99px;background:var(--rule-2);overflow:hidden;display:flex}
.budget-fill{background:var(--ok);transition:width .2s}
.budget-fill.over{background:var(--accent)}

/* ---------- wallet stack (notes) ---------- */
.wallet{display:flex;flex-direction:column;padding-bottom:6px}
.wcard{
  background:var(--card);
  border:1px solid var(--rule);
  border-radius:18px;
  margin-top:-10px;
  box-shadow:0 -8px 22px -14px rgba(17,17,16,.5);
  transition:margin-top .3s cubic-bezier(.2,.85,.25,1), box-shadow .3s, border-color .2s;
  position:relative;
}
.wcard:first-child{margin-top:0}
.wcard[data-open="true"]{margin-top:16px;border-color:var(--ink-3);box-shadow:var(--shadow);z-index:2}
.wcard:first-child[data-open="true"]{margin-top:0}
.wcard[data-open="true"] + .wcard{margin-top:16px}
.wcard-head{
  width:100%;display:flex;align-items:center;gap:12px;
  padding:14px 16px;background:transparent;border:0;border-radius:18px;
  cursor:pointer;text-align:left;
}
.wn{font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:-.03em;font-variant-numeric:tabular-nums;color:var(--ink-3);min-width:2.2ch;flex-shrink:0}
.wcard[data-open="true"] .wn{color:var(--accent)}
.wtitle{flex:1;min-width:0;font-size:15px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wtitle.empty{color:var(--ink-3);font-style:italic}
.wmin{font-family:var(--mono);font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums;flex-shrink:0}
.wchev{color:var(--ink-3);font-size:12px;flex-shrink:0;transition:transform .3s}
.wcard[data-open="true"] .wchev{transform:rotate(180deg)}
.wbody{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s cubic-bezier(.2,.85,.25,1)}
.wcard[data-open="true"] .wbody{grid-template-rows:1fr}
.wbody-in{overflow:hidden}
.wbody-pad{padding:0 16px 16px;display:flex;flex-direction:column;gap:10px}
.titlefield{
  width:100%;background:transparent;border:0;border-bottom:1.5px solid var(--rule);
  padding:4px 0 7px;font-family:var(--display);font-weight:700;font-size:18px;
  letter-spacing:-.02em;line-height:1.25;
}
.titlefield::placeholder{color:var(--ink-3);font-weight:600}
.titlefield:focus-visible{outline:0;border-bottom-color:var(--accent)}
.wrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.mstep{display:flex;align-items:center;gap:3px;border:1px solid var(--rule);border-radius:99px;padding:3px}
.mstep button{width:34px;height:34px;border:0;background:transparent;border-radius:99px;cursor:pointer;font-size:17px;line-height:1}
.mstep button:hover{background:var(--rule-2)}
.mstep .v{font-family:var(--mono);font-size:14px;min-width:4.5ch;text-align:center;font-variant-numeric:tabular-nums}
.slide-del{border:0;background:transparent;color:var(--ink-3);cursor:pointer;font-size:13.5px;text-decoration:underline;text-underline-offset:3px;padding:0}
.slide-del:hover{color:var(--accent)}

.actions{display:flex;gap:9px;align-items:center}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--paper);font-weight:600;font-size:16px;padding:14px 20px;border-radius:99px;cursor:pointer;flex:1}
.btn.accent{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink-2);border-color:var(--rule);font-weight:500;flex:0 0 auto}
.btn.ghost:hover{color:var(--ink);border-color:var(--ink-3)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-size:15px;font-weight:500;cursor:pointer;text-decoration:underline;text-underline-offset:4px;align-self:flex-start;text-align:left}

/* ---------- present ---------- */
/* page deck - three cells, the middle one live. Dragging moves the whole
   track so the neighbouring page is revealed continuously, the way a book
   behaves, instead of snapping back and being rebuilt. */
/* The present screen is a fixed frame. Note length varies from slide to
   slide, so if the card sized itself to its content every control under it
   would move on each page turn - and on stage you reach for those without
   looking. The card fills the frame instead and long notes scroll inside it. */
.presentframe{display:flex;flex-direction:column;gap:12px;min-height:380px}
.pdeck{overflow:hidden;margin:0 -18px;flex:1;min-height:0}
.ptrack{display:flex;width:300%;height:100%;touch-action:pan-y;will-change:transform;transform:translateX(-33.3333%)}
.pcell{width:33.3333%;height:100%;flex-shrink:0;padding:0 18px}
.pcard{
  background:var(--card);border:1px solid var(--rule);border-radius:var(--radius);
  padding:18px 18px 20px;display:flex;flex-direction:column;gap:16px;
  user-select:none;-webkit-user-select:none;
  height:100%;
  box-shadow:-14px 0 26px -18px rgba(17,17,16,.55), 14px 0 26px -18px rgba(17,17,16,.55);
}
.pcard.ghost{opacity:.98}
.pcard.over{border-color:var(--accent)}
.pcard-top{display:flex;align-items:center;gap:11px;flex-shrink:0}
.pcard-n{font-family:var(--display);font-weight:800;font-size:clamp(30px,8.6vw,40px);letter-spacing:-.05em;line-height:.95;font-variant-numeric:tabular-nums;flex-shrink:0}
.pcard-n small{font-size:.5em;font-weight:700;color:var(--ink-3);letter-spacing:-.02em}
.pcard-title{flex:1;min-width:0;font-size:16px;font-weight:600;line-height:1.3;letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.resetbtn{width:40px;height:40px;border-radius:99px;border:1px solid var(--rule);background:transparent;cursor:pointer;font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--ink-2)}
.resetbtn:hover{color:var(--ink);border-color:var(--ink-3)}

.ringrow{position:relative;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ringnav{
  position:absolute;top:50%;transform:translateY(-50%);
  width:48px;height:48px;border-radius:99px;
  border:1px solid var(--rule);background:var(--card);
  cursor:pointer;font-size:18px;line-height:1;
  display:flex;align-items:center;justify-content:center;
}
.ringnav:disabled{opacity:.26;cursor:not-allowed}
.ringnav.prev{left:0}
.ringnav.next{right:0}
.ringbtn{border:0;background:transparent;padding:0;cursor:pointer;display:block;border-radius:99px}
.ringbtn:active{transform:scale(.985)}
.ringbtn:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
.ringwrap{position:relative;flex-shrink:0;height:min(52vw,196px,29dvh);aspect-ratio:1}
.ring{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-linecap:round}
.ring-track{stroke:var(--rule-2);stroke-width:9}
.ring-arc{stroke:var(--ok);stroke-width:9;transition:stroke-dashoffset .3s linear, stroke .3s}
.ring-arc.warn{stroke:var(--warn)}
.ring-arc.over{stroke:var(--accent)}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.ring-time{font-family:var(--display);font-weight:800;font-size:clamp(38px,11vw,50px);letter-spacing:-.045em;line-height:1;font-variant-numeric:tabular-nums}
.ring-time.over{color:var(--accent)}
.ring-sub{font-family:var(--mono);font-size:10.5px;letter-spacing:.07em;color:var(--ink-3);text-transform:uppercase;text-align:center;padding:0 6px}
.ring-sub.go{color:var(--accent)}
.ring-cap{font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);text-align:center}

.pnote{font-size:19px;line-height:1.45;letter-spacing:-.01em;white-space:pre-wrap;flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.pnote.empty{color:var(--ink-3);font-style:italic;font-size:16px}

.gauges{display:flex;gap:9px;flex-shrink:0;padding-top:2px}
.gauge{flex:1;border:1px solid var(--rule);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.gauge .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.gauge .v{font-family:var(--display);font-weight:700;font-size:21px;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1}
.gauge.behind{border-color:var(--accent);background:var(--accent-soft)}
.gauge.behind .v,.gauge.behind .k{color:var(--accent)}
.gauge.ahead .v{color:var(--ok)}

/* next-up strip */
.nextup{
  width:100%;display:flex;align-items:center;gap:12px;text-align:left;flex-shrink:0;
  background:var(--card);border:1px solid var(--rule);border-radius:14px;
  padding:12px 14px;cursor:pointer;
}
.nextup:hover{border-color:var(--ink-3)}
.nextup:disabled{opacity:.55;cursor:default}
.nextup-k{font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);flex-shrink:0}
.nextup-t{flex:1;min-width:0;font-size:14.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nextup-a{color:var(--ink-3);flex-shrink:0}

.dots{display:flex;gap:5px;flex-wrap:nowrap;justify-content:center;overflow:hidden;flex-shrink:0;height:9px;align-items:center}
.dot{width:7px;height:7px;border-radius:99px;background:var(--rule);border:0;padding:0;cursor:pointer;transition:width .18s}
.dot.done{background:var(--ink-3)}
.dot[aria-current="true"]{background:var(--accent);width:20px}
.dotbar{height:5px;border-radius:99px;background:var(--rule);overflow:hidden;flex-shrink:0}
.dotbar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .25s}


/* ---------- bottom navigation, glass ---------- */
.navbar{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(14px + env(safe-area-inset-bottom,0px));
  z-index:20;
  width:min(calc(100% - 28px),380px);
  display:flex;gap:4px;padding:8px 8px;
  border-radius:26px;
  background:var(--card);
  background:var(--glass);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  backdrop-filter:blur(24px) saturate(180%);
  border:1px solid var(--glass-edge);
  box-shadow:var(--shadow), inset 0 1px 0 var(--glass-top);
}
.navitem{
  flex:1;border:0;background:transparent;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:4px 2px 2px;border-radius:18px;min-width:0;
}
.navitem:disabled{opacity:.34;cursor:not-allowed}
.navicon{
  width:56px;height:30px;border-radius:99px;
  display:flex;align-items:center;justify-content:center;
  color:var(--ink-2);transition:background .22s, color .22s;
}
.navicon svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.navlabel{font-size:11.5px;font-weight:500;color:var(--ink-2);white-space:nowrap}
.navitem[aria-current="true"] .navicon{color:var(--accent)}
.navind{
  position:absolute;top:8px;left:0;height:30px;width:56px;border-radius:99px;
  background:var(--accent-soft);
  -webkit-backdrop-filter:blur(9px) saturate(160%);
  backdrop-filter:blur(9px) saturate(160%);
  pointer-events:none;z-index:0;
  box-shadow:inset 0 1px 0 var(--glass-top);
}
.navitem{position:relative;z-index:1}
.navitem[aria-current="true"] .navlabel{color:var(--ink);font-weight:600}

.note{font-size:13.5px;color:var(--ink-3);line-height:1.5;border-top:1px solid var(--rule-2);padding-top:14px}
.err{border:1px solid var(--accent);border-radius:10px;padding:13px 15px;font-size:15px;line-height:1.5;background:var(--accent-soft)}
.thinking{display:flex;align-items:center;gap:10px;color:var(--ink-2);font-size:15.5px}
.blip{width:9px;height:9px;border-radius:99px;background:var(--accent);animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.25;transform:scale(.75)}50%{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion: reduce){
  .blip{animation:none;opacity:.85}
  .dot,.wcard,.wbody,.wchev,.ring-arc,.navicon{transition:none}
  .ptrack{transition:none !important}
}
</style>

/* Page images are far too big for localStorage, so they live in IndexedDB
   and the deck state keeps only text. */
var THUMBS = [];
var _db = null;
function idb(){
  if (_db) return Promise.resolve(_db);
  return new Promise(function(res, rej){
    try {
      var r = indexedDB.open("slideclock", 1);
      r.onupgradeneeded = function(){ r.result.createObjectStore("kv"); };
      r.onsuccess = function(){ _db = r.result; res(_db); };
      r.onerror = function(){ rej(r.error); };
    } catch(e){ rej(e); }
  });
}
function idbPut(k, v){
  return idb().then(function(db){
    return new Promise(function(res, rej){
      var t = db.transaction("kv","readwrite");
      t.objectStore("kv").put(v, k);
      t.oncomplete = function(){ res(); };
      t.onerror = function(){ rej(t.error); };
    });
  });
}
function idbGet(k){
  return idb().then(function(db){
    return new Promise(function(res, rej){
      var t = db.transaction("kv","readonly");
      var q = t.objectStore("kv").get(k);
      q.onsuccess = function(){ res(q.result); };
      q.onerror = function(){ rej(q.error); };
    });
  });
}

function mmss(ms){
  var neg = ms < 0;
  var s = Math.floor(Math.abs(ms)/1000);
  var m = Math.floor(s/60); s = s % 60;
  return {neg:neg, mm:(neg?"-":"")+m, ss:(s<10?"0":"")+s};
}

var navItems = [], navInd = null, navX = 0;
function buildNav(){

  NAV.forEach(function(n,i){

    bar.appendChild(b);

/* The indicator slides between tabs and stretches as it travels, so it reads
   as one object moving rather than a highlight blinking from tab to tab. */
function updateNav(animate){
  navItems.forEach(function(b,i){
    b.setAttribute("aria-current", String(i===S.step));
    b.disabled = (i > 0 && S.slides.length === 0);
    /* the bar is built once, so its labels are refreshed here or they
       would keep the language they were born in */
    b.querySelector(".navlabel").textContent = tr(NAV[i][0]);
  });
  var icon = navItems[S.step] && navItems[S.step].querySelector(".navicon");
  if (!icon || !navInd) return;
  var bar = document.getElementById("navbar");
  var x = icon.getBoundingClientRect().left - bar.getBoundingClientRect().left;
  var w = icon.offsetWidth;
  navInd.style.width = w + "px";
  var from = navX, to = x;
  navX = x;
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (!animate || reduce || from === to || !navInd.animate){
    navInd.style.transform = "translateX(" + to + "px)";
    return;
  }
  var mid = (from + to) / 2;
  var stretch = Math.min(1.34, 1 + Math.abs(to - from) / (w * 4.5));
  navInd.style.transform = "translateX(" + to + "px)";
  navInd.animate([
    {transform:"translateX(" + from + "px) scaleX(1)"},
    {transform:"translateX(" + mid + "px) scaleX(" + stretch + ")", offset:.44},
    {transform:"translateX(" + to + "px) scaleX(1)"}
  ], {duration:460, easing:"cubic-bezier(.32,1.02,.3,1)", fill:"none"});
}

function actualBySlide(run){
  /* a speaker can go back and forth, so add up every visit to a slide */
  var acc = {};
  (run.marks||[]).forEach(function(m){
    if (typeof m.to !== "number") return;
    acc[m.i] = (acc[m.i] || 0) + Math.max(0, m.to - m.from);
  });
  return acc;
}

function buildReview(){
  var run = S.rehearsal;
  var wrap = el("section","step review");
  var h = el("div","panel-head");
  h.appendChild(el("h2","",tr("reviewH")));
  h.appendChild(el("p","sub",tr("reviewSub")));
  wrap.appendChild(h);

  var planned = allocatedMs();
  var sum = el("div","rsum" + (run.totalMs > planned ? " over" : ""));
  sum.appendChild(el("span","k",tr("actualCol")));
  sum.appendChild(el("span","v", fmt(run.totalMs)));
  sum.appendChild(el("span","k", tr("runTotal", fmt(planned), fmt(run.totalMs))));
  wrap.appendChild(sum);

  var audio = null, segEnd = null, rows = el("div","rrows");

  function highlight(idx){
    [].forEach.call(rows.children, function(x,j){
      x.setAttribute("aria-current", String(j === idx));
    });
  }

  if (run.hasAudio){
    audio = el("audio");
    audio.controls = true;
    audio.preload = "metadata";
    idbGet("run-audio").then(function(blob){
      if (!blob) return;
      audio.src = URL.createObjectURL(blob);
      /* a MediaRecorder webm carries no duration, so seeking is dead until
         the browser is forced to scan it */
      audio.addEventListener("loadedmetadata", function(){
        if (audio.duration !== Infinity) return;
        audio.currentTime = 1e6;
        audio.addEventListener("timeupdate", function once(){
          audio.removeEventListener("timeupdate", once);
          audio.currentTime = 0;
        });
      });
    }).catch(function(){});

    /* playing one slide means stopping at the end of that slide, so you hear
       exactly the part you were unsure about and nothing after it */
    audio.addEventListener("timeupdate", function(){
      var ms = audio.currentTime * 1000;
      if (segEnd !== null && ms >= segEnd){ audio.pause(); segEnd = null; }
      var at = -1;
      (run.marks || []).forEach(function(m){
        var to = (typeof m.to === "number") ? m.to : run.totalMs;
        if (ms >= m.from && ms < to) at = m.i;
      });
      highlight(at);
    });
    audio.addEventListener("pause", function(){ segEnd = null; });
    wrap.appendChild(audio);
    wrap.appendChild(el("p","hint",tr("seekHint")));
  } else {
    wrap.appendChild(el("p","hint", run.armed ? tr("recEmpty") : tr("recNotArmed")));
  }

  var acc = actualBySlide(run);

  S.slides.forEach(function(sl,i){
    var plan = sl.min*60000, seen = acc.hasOwnProperty(i), act = acc[i] || 0, d = act - plan;
    var r = el("button","rrow");
    r.appendChild(el("span","rn", String(i+1).padStart(2,"0")));
    r.appendChild(el("span","rt", labelFor(sl) || tr("nothingYet")));
    r.appendChild(el("span","rtimes", seen ? (fmt(plan) + " \u2192 " + fmt(act)) : fmt(plan)));
    /* a slide you never reached is not a slide you were quick on */
    r.appendChild(seen
      ? el("span","rdelta" + (Math.abs(d) < 5000 ? "" : (d > 0 ? " over" : " under")),
           (d > 0 ? "+" : d < 0 ? "\u2212" : "") + fmt(Math.abs(d)))
      : el("span","rdelta", tr("notReached")));

    var first = (run.marks || []).filter(function(m){ return m.i === i; })[0];
    var play = el("button","rplay","\u25B6");
    play.setAttribute("aria-label", tr("playSlide") + " " + (i+1));
    play.disabled = !(audio && first);
    function playThis(ev){
      if (ev) ev.stopPropagation();
      if (!audio || !first || !audio.src) return;
      segEnd = (typeof first.to === "number") ? first.to : run.totalMs;
      try { audio.currentTime = first.from / 1000; audio.play(); } catch(e){}
      highlight(i);
    }
    play.onclick = playThis;
    r.onclick = playThis;
    r.appendChild(play);
    rows.appendChild(r);
  });
  wrap.appendChild(rows);

  var act1 = el("div","actions");
  var apply = el("button","btn accent", tr("applyTimes"));
  apply.onclick = function(){
    S.slides.forEach(function(sl,i){
      if (!acc.hasOwnProperty(i)) return;        /* leave untouched what you never reached */
      var m = Math.round((acc[i]/60000)*2)/2;
      sl.min = Math.max(0.5, Math.min(30, m || 0.5));
    });
    S.totalMin = Math.max(1, Math.round((allocatedMs()/60000)*2)/2);
    save();
    apply.replaceWith(el("div","importmsg", tr("applied")));
  };
  act1.appendChild(apply);
  wrap.appendChild(act1);

  var act2 = el("div","actions");
  var back = el("button","btn ghost", tr("backToClock"));
  back.onclick = function(){
    set({reviewing:false, running:false, accMs:0, slideStartMs:0, cur:0, everStarted:false});
  };
  var drop = el("button","linkbtn", tr("discardRun"));
  drop.onclick = function(){
    idbPut("run-audio", null).catch(function(){});
    set({rehearsal:null, reviewing:false, running:false, accMs:0, slideStartMs:0, cur:0, everStarted:false});
  };
  act2.appendChild(back);
  wrap.appendChild(act2);
  wrap.appendChild(drop);
  return wrap;
}

function stepPresent(){
  var p = el("section","step");
  if (!S.slides.length){
    p.appendChild(el("p","sub",tr("noSlides")));
    var b0 = el("button","btn",tr("backSetup")); b0.onclick=function(){ set({step:0}); };
    p.appendChild(b0);
    return p;
  }
  if (S.reviewing && S.rehearsal) return buildReview();
  var N = S.slides.length;
  var i = Math.max(0, Math.min(N-1, S.cur));
  var sl = S.slides[i];

  /* three cells: previous, live, next. The neighbours are really there, so a
     drag reveals them continuously instead of snapping back. */
  var frame = el("div","presentframe");
  var deck = el("div","pdeck");
  var track = el("div","ptrack");
  var live = null;
  var ctl = {
    onPrev:   function(){ settle(1); },
    onNext:   function(){ settle(-1); },
    onArm:    function(){
      if (S.run) return;
      if (recArmed){ recDisarm(); render(); return; }
      recArm().then(function(){ render(); });
    },
    onFinish: function(){
      releaseWake();
      if (S.running){ S.accMs = elapsedMs(); S.running = false; }   /* bank the time first */
      recPause();
      finishRun().then(function(){ set({reviewing:true}); });
    },
    onReset:  function(){
      releaseWake();
      recStop();
      set({running:false, accMs:0, slideStartMs:0, cur:0, everStarted:false, run:null});
    },
    onToggle: function(){
      if (S.running){
        S.accMs = elapsedMs(); S.running = false; releaseWake(); recPause();
      } else {
        S.startedAt = Date.now(); S.running = true; requestWake();
        if (!S.everStarted){
          S.everStarted = true;
          if (recArmed){
            S.run = {marks:[{i:S.cur, from:0}], totalMs:0, at:0, hasAudio:false, armed:true};
            recStart();
          } else {
            S.run = {marks:[{i:S.cur, from:0}], totalMs:0, at:0, hasAudio:false, armed:false};
          }
        } else {
          recResume();
        }
      }
      save(); render();
    }
  };
  [-1,0,1].forEach(function(off){
    var cell = el("div","pcell");
    var j = i + off;
    if (j >= 0 && j < N){
      var c = buildCard(j, off===0, off===0 ? ctl : null);
      if (off===0) live = c;
      cell.appendChild(c);
    }
    track.appendChild(cell);
  });
  deck.appendChild(track);
  frame.appendChild(deck);

  var nx = el("button","nextup");
  if (i < N-1){
    nx.appendChild(el("span","nextup-k", tr("nextN", i+2)));
    nx.appendChild(el("span","nextup-t", labelFor(S.slides[i+1]) || tr("nothingWritten")));
    nx.appendChild(el("span","nextup-a","\u2192"));
    nx.onclick=function(){ settle(-1); };
  } else {
    nx.disabled = true;
    nx.appendChild(el("span","nextup-k",tr("end")));
    nx.appendChild(el("span","nextup-t",tr("lastSlide")));
  }
  frame.appendChild(nx);

  var dots;
  if (N <= 24){
    dots = el("div","dots");
    S.slides.forEach(function(_,j){
      var d = el("button","dot"+(j<i?" done":""));
      d.setAttribute("aria-label",tr("slideN", j+1));
      d.setAttribute("aria-current", String(j===i));
      d.onclick=function(){ goSlide(j); };
      dots.appendChild(d);
    });
  } else {
    dots = el("div","dotbar");
    var fillbar = el("i");
    fillbar.style.width = (((i+1)/N)*100) + "%";
    dots.appendChild(fillbar);
  }
  frame.appendChild(dots);

  if (recSupported && (recArmed || (S.run && S.run.armed))){
    var chip = el("div","recchip");
    chip.appendChild(el("span","recdot"));
    chip.appendChild(el("span","", tr(S.run ? "recOn" : "recReady")));
    frame.appendChild(chip);
  } else if (recError === "denied"){
    frame.appendChild(el("div","importmsg bad", tr("micDenied")));
  }
  if (S.rehearsal && !S.run){
    var seeLast = el("button","linkbtn", tr("reviewLink"));
    seeLast.onclick = function(){ set({reviewing:true}); };
    frame.appendChild(seeLast);
  }
  p.appendChild(frame);

  /* Size the frame to whatever is actually left between the masthead and the
     navigation bar, so every control lands in the same place on every slide. */
  function fitFrame(){
    /* Collapse first, so the measured top depends only on the masthead above
       and never on this frame's own contents. Measuring an expanded frame is
       what let the layout drift by a line of note text. */
    frame.style.height = "0px";
    var nav = document.getElementById("navbar");
    var top = frame.getBoundingClientRect().top;
    var vh  = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
    var navH = (nav ? nav.offsetHeight : 62) + 30;
    var room = Math.round(vh - top - navH);
    frame.style.height = Math.max(380, room) + "px";
    /* On a viewport too short to hold the frame (a phone turned sideways),
       give the page its scrolling back rather than clipping the card. */
    document.body.classList.toggle("presenting", room >= 380);
  }
  fitPresent = fitFrame;

  /* ---- page turn: the track follows the finger, then settles ---- */
  var BASE = -33.3333, STEP = 33.3333;
  var drag=false, locked=false, sx=0, sy=0, t0=0, settling=false;

  function setX(px){
    track.style.transform = "translateX(calc(" + BASE + "% + " + px + "px))";
  }
  function settle(dir){          /* -1 next, +1 previous, 0 stay */
    if (settling) return;
    if (dir === -1 && i >= N-1) dir = 0;
    if (dir === 1 && i <= 0) dir = 0;
    track.style.transition = "transform .44s cubic-bezier(.22,1,.36,1)";
    track.style.transform = "translateX(" + (dir===0 ? BASE : (dir===-1 ? BASE-STEP : BASE+STEP)) + "%)";
    if (dir === 0) return;
    settling = true;
    var done = false;
    function finish(){
      if (done) return;
      done = true;
      track.removeEventListener("transitionend", finish);
      goSlide(i + (dir===-1 ? 1 : -1));
    }
    track.addEventListener("transitionend", finish);
    setTimeout(finish, 500);
  }

  track.addEventListener("pointerdown", function(e){
    if (settling) return;
    if (e.pointerType==="mouse" && e.button!==0) return;
    sx=e.clientX; sy=e.clientY; t0=Date.now(); drag=true; locked=false;
    track.style.transition="none";
  });
  track.addEventListener("pointermove", function(e){
    if(!drag) return;
    var dx=e.clientX-sx, dy=e.clientY-sy;
    if(!locked){
      if(Math.abs(dx)<8 && Math.abs(dy)<8) return;
      if(Math.abs(dy)>Math.abs(dx)){ drag=false; setX(0); return; }
      locked=true;
    }
    var edge = (dx>0 && i===0) || (dx<0 && i===N-1);
    setX(edge ? dx*0.18 : dx);
  });
  function release(e){
    if(!drag) return;
    drag=false;
    if(!locked){ return; }
    var dx = e.clientX - sx;
    var v  = Math.abs(dx) / Math.max(1, Date.now()-t0);   /* px per ms */
    var w  = deck.clientWidth || 320;
    var far = Math.abs(dx) > w*0.22;
    var flick = v > 0.45 && Math.abs(dx) > 18;
    if (far || flick) settle(dx < 0 ? -1 : 1);
    else settle(0);
  }
  track.addEventListener("pointerup", release);
  track.addEventListener("pointercancel", function(){ drag=false; if(!settling) settle(0); });

  function goSlide(j){
    var k = Math.max(0, Math.min(N-1, j));
    if (k === i){ settling=false; settle(0); return; }
    var e = elapsedMs();
    if (S.run && S.run.marks.length){
      S.run.marks[S.run.marks.length-1].to = e;
      S.run.marks.push({i:k, from:e});
    }
    S.slideStartMs = e; S.cur = k; save(); render();
  }
  keyNav = function(e){
    if (S.step !== 2) return;
    if (e.key === "ArrowRight") settle(-1);
    else if (e.key === "ArrowLeft") settle(1);
    else if (e.key === " "){ e.preventDefault(); ctl.onToggle(); }
  };

  function tick(){
    if (!live) return;
    var P = live._p;
    var e = elapsedMs();
    var budget = sl.min*60000;
    var onThis = e - S.slideStartMs;
    var left = budget - onThis;

    P.rtime.textContent = fmt(left);
    P.rtime.className = "ring-time" + (left<0 ? " over" : "");
    var frac = Math.max(0, Math.min(1, left/Math.max(1,budget)));
    P.arc.setAttribute("stroke-dashoffset", String(CIRC*(1-frac)));
    P.arc.setAttribute("class","ring-arc" + (left<0 ? " over" : (frac<=0.25 ? " warn" : "")));
    live.className = "pcard" + (left<0 ? " over" : "");

    var overallLeft = totalMs() - e;
    P.gTv.textContent = fmt(overallLeft);
    P.gT.className = "gauge" + (overallLeft<0 ? " behind" : "");

    var planned = plannedBefore(i) + Math.min(onThis, budget);
    var drift = e - planned;
    if (!S.everStarted){ P.gDv.textContent=tr("notStarted"); P.gD.className="gauge"; }
    else if (Math.abs(drift) < 5000){ P.gDv.textContent=tr("onTime"); P.gD.className="gauge"; }
    else if (drift > 0){ P.gDv.textContent=tr("behind", fmt(drift)); P.gD.className="gauge behind"; }
    else { P.gDv.textContent=tr("ahead", fmt(-drift)); P.gD.className="gauge ahead"; }

    if (!S.everStarted){
      P.rsub.textContent = tr("tapStart");
      P.rsub.className = "ring-sub go";
      P.ring.setAttribute("aria-label",tr("startClock"));
    } else if (S.running){
      P.rsub.textContent = tr("ofTime", fmt(budget));
      P.rsub.className = "ring-sub";
      P.ring.setAttribute("aria-label",tr("pauseClock"));
    } else {
      P.rsub.textContent = tr("pausedTap");
      P.rsub.className = "ring-sub go";
      P.ring.setAttribute("aria-label",tr("resumeClock"));
    }
  }
  tick();
  clearInterval(ticker);
  ticker = setInterval(tick, 250);
  return p;
}

var keyNav = null;
document.addEventListener("keydown", function(e){ if (keyNav) keyNav(e); });

/* ---------- screen wake lock ---------- */
var wakeLock = null;
function requestWake(){
  try {
    if (navigator.wakeLock && !wakeLock){
      navigator.wakeLock.request("screen").then(function(w){
        wakeLock = w;
        w.addEventListener("release", function(){ wakeLock = null; });
      }).catch(function(){});
    }
  } catch(e){}
}
function releaseWake(){ try { if(wakeLock){ wakeLock.release(); wakeLock=null; } } catch(e){} }
document.addEventListener("visibilitychange", function(){
  if (document.visibilityState==="visible" && S.running) requestWake();
});

/* ---------- the one model call ---------- */
function suggestSplit(host){
  if (!sampleFn) return;
  var think = el("div","thinking");
  think.appendChild(el("span","blip"));
  think.appendChild(el("span","",tr("reading")));
  host.replaceWith(think);

  var body = S.slides.map(function(s,i){
    return "Slide "+(i+1)+": "+((s.note||"").trim() || "(no note)");
  }).join("\n");

  var prompt =
    "You are helping a speaker divide their time across slides. Do NOT write or rewrite any content.\n" +
    "Your only job is to allocate minutes.\n\n" +
    "Talk: " + (S.title || "(untitled)") + "\n" +
    "Total time: " + S.totalMin + " minutes across " + S.slides.length + " slides.\n\n" +
    "The speaker's notes:\n" + body + "\n\n" +
    "Allocate time per slide. Rules:\n" +
    "- Slides with more to explain get more time; title, section-break and thank-you slides get the least.\n" +
    "- A slide with no note still needs a small allocation.\n" +
    "- Use steps of 0.5 minutes. Minimum 0.5.\n" +
    "- The values must sum to exactly " + S.totalMin + ".\n\n" +
    "Output JSON only: {\"minutes\":[n1,n2,...]} with exactly " + S.slides.length + " numbers, in slide order.";

  sampleFn.json(prompt, {modelTier:"quick"}).then(function(out){
    var arr = out && out.minutes;
    if (!Array.isArray(arr) || arr.length !== S.slides.length) throw {code:"bad"};
    var sum = 0;
    arr.forEach(function(v,i){
      var m = Math.max(0.5, Math.round(Number(v)*2)/2);
      S.slides[i].min = m; sum += m;
    });
    var diff = Math.round((S.totalMin - sum)*2)/2;
    if (diff !== 0){
      var idx = 0;
      S.slides.forEach(function(s,j){ if (s.min > S.slides[idx].min) idx = j; });
      S.slides[idx].min = Math.max(0.5, Math.round((S.slides[idx].min + diff)*2)/2);
    }
    save(); render();
  }).catch(function(e){
    var msg = (e && e.code==="not_granted") ? tr("errNotGranted")
            : (e && e.code==="rate_limited") ? tr("errRate")
            : tr("errGeneric");
    think.replaceWith(el("div","err", msg));
  });
}

/* ---------- rehearsal recording ----------
   Audio alone is not worth much: listening back to fifteen minutes to find
   the slide you overran is work nobody does. What makes it useful is the
   timeline - every page turn is stamped, so afterwards the run can be shown
   as planned against actual, and the actual times can become the new plan.

   The blob stays in IndexedDB on the device. Nothing is uploaded, and only
   the most recent run is kept. */
var recSupported = (typeof MediaRecorder !== "undefined") &&
                   !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
var recArmed = false, recorder = null, recChunks = [], recStream = null, recError = null;

/* Permission is requested when you arm, not when you start. Asking at the
   moment the clock starts puts a system dialog in front of someone who is
   about to speak, and if they miss it the whole run is silently unrecorded -
   which is exactly what happened. */
function recArm(){
  if (!recSupported){ recError = "unsupported"; return Promise.resolve(false); }
  return navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
    recStream = stream; recArmed = true; recError = null; return true;
  }).catch(function(){
    recStream = null; recArmed = false; recError = "denied"; return false;
  });
}
function recDisarm(){
  try { if (recStream) recStream.getTracks().forEach(function(t){ t.stop(); }); } catch(e){}
  recStream = null; recArmed = false; recError = null;
}

function pickMime(){
  var want = ["audio/mp4","audio/webm;codecs=opus","audio/webm","audio/ogg"];
  for (var i=0;i<want.length;i++){
    try { if (MediaRecorder.isTypeSupported(want[i])) return want[i]; } catch(e){}
  }
  return "";
}

function recStart(){
  if (!recArmed || !recStream || recorder) return;
  try {
    recChunks = [];
    var mime = pickMime();
    recorder = mime ? new MediaRecorder(recStream, {mimeType:mime}) : new MediaRecorder(recStream);
    recorder.ondataavailable = function(e){ if (e.data && e.data.size) recChunks.push(e.data); };
    recorder.start(1000);          /* flush every second, so a crash costs one second */
    recError = null;
  } catch(e){
    recorder = null; recError = "failed";
  }
}

function recPause(){ try { if (recorder && recorder.state === "recording") recorder.pause(); } catch(e){} }
function recResume(){ try { if (recorder && recorder.state === "paused") recorder.resume(); } catch(e){} }

function recStop(){
  return new Promise(function(res){
    if (!recorder){ res(null); return; }
    var r = recorder;
    recorder = null;
    r.onstop = function(){
      try { recStream.getTracks().forEach(function(t){ t.stop(); }); } catch(e){}
      recStream = null;
      var blob = recChunks.length ? new Blob(recChunks, {type: recChunks[0].type || "audio/webm"}) : null;
      recChunks = [];
      res(blob);
    };
    try { r.stop(); } catch(e){ res(null); }
  });
}

/* close the open mark and file the run away */
function finishRun(){
  var run = S.run;
  if (!run || !run.marks.length) return recStop().then(function(){});
  var e = elapsedMs();
  run.marks[run.marks.length-1].to = e;
  run.totalMs = e;
  run.at = Date.now();
  return recStop().then(function(blob){
    run.hasAudio = !!blob;
    S.rehearsal = run;
    S.run = null;
    save();
    if (blob) return idbPut("run-audio", blob).catch(function(){});
  });
}

/* ---------- importing a deck ----------
   pdf.js is fetched only when someone actually imports, so the app still
   opens with no network. Everything happens on the device: the file is
   never uploaded.

   Only the page's own heading becomes the slide title. The rest of the
   text on the slide is deliberately NOT poured into the note - those are
   the words on the screen, not the words you say, and putting them in the
   note is how people end up reading their slides aloud. */
var PDF_SRC = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
var PDF_WORKER = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

function loadPdfJs(){
  if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  return new Promise(function(res, rej){
    var sc = document.createElement("script");
    sc.src = PDF_SRC;
    sc.onload = function(){
      if (!window.pdfjsLib) return rej(new Error("no pdfjsLib"));
      try { window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDF_WORKER; } catch(e){}
      res(window.pdfjsLib);
    };
    sc.onerror = function(){ rej(new Error("script")); };
    document.head.appendChild(sc);
  });
}

function titleFromText(items){
  /* the first line with real words on it, which on almost every deck is
     the slide's own heading */
  var lines = [], last = null;
  items.forEach(function(it){
    var y = Math.round((it.transform && it.transform[5]) || 0);
    if (last === null || Math.abs(y - last) > 4){ lines.push(it.str); last = y; }
    else { lines[lines.length-1] += it.str; }
  });
  for (var i=0;i<lines.length;i++){
    var line = lines[i].replace(/\s+/g," ").trim();
    if (line.length >= 2 && /[^\s\d.\-\u2022]/.test(line)){
      return line.length > 70 ? line.slice(0,70).trim() + "\u2026" : line;
    }
  }
  return "";
}

function importPdf(file, onProgress){
  return loadPdfJs().then(function(pdfjsLib){
    return file.arrayBuffer();
  }).then(function(buf){
    return window.pdfjsLib.getDocument({data: buf}).promise;
  }).then(function(doc){
    var n = doc.numPages, slides = [], thumbs = [];
    var chain = Promise.resolve();
    for (var i=1;i<=n;i++){
      (function(page){
        chain = chain.then(function(){
          if (onProgress) onProgress(page, n);
          return doc.getPage(page).then(function(pg){
            return pg.getTextContent().then(function(tc){
              var title = titleFromText(tc.items || []);
              slides.push({title:title, note:"", min:1});
              var vp = pg.getViewport({scale:1});
              var scale = Math.min(2, 560 / vp.width);
              var v2 = pg.getViewport({scale:scale});
              var cv = document.createElement("canvas");
              cv.width = Math.ceil(v2.width); cv.height = Math.ceil(v2.height);
              return pg.render({canvasContext: cv.getContext("2d"), viewport: v2}).promise
                .then(function(){
                  try { thumbs.push(cv.toDataURL("image/jpeg", 0.72)); }
                  catch(e){ thumbs.push(""); }
                });
            });
          });
        });
      })(i);
    }
    return chain.then(function(){ return {slides:slides, thumbs:thumbs}; });
  });
}

function loadDemo(){
  var d = DEMO[LANG] || DEMO.en;
  set({
    demo:true, step:1, open:0, title:d.title, totalMin:15, cur:0,
    running:false, accMs:0, slideStartMs:0, everStarted:false,
    run:null, rehearsal:null, reviewing:false,
    slides: d.slides.map(function(x){ return {min:x.min, title:x.title, note:x.note}; })
  });
}

var importNote = null;
var lastStep = -1, navBuilt = false;
function render(){
  clearInterval(ticker); ticker=null; keyNav=null; fitPresent=null;
  renderLangSel();
  document.documentElement.lang = (LANG === "zh" ? "zh-Hant" : "en");
  document.body.classList.toggle("presenting", S.step === 2 && !(S.reviewing && S.rehearsal));
  if (!navBuilt){ buildNav(); navBuilt = true; }
  var stage = document.getElementById("stage");
  var views = [stepSetup, stepNotes, stepPresent];
  stage.replaceChildren(views[S.step]());
  if (fitPresent) fitPresent();
  var stepChanged = lastStep !== S.step;
  /* Only a change of step moves the page. Tapping a control inside a step
     must never scroll the view out from under the finger. */
  if (stepChanged && S.step !== 2) window.scrollTo({top:0, behavior:"instant"});
  requestAnimationFrame(function(){ updateNav(lastStep !== -1); lastStep = S.step; });
}
render();
</script>

<div id="install" hidden>
  <span id="install-msg"></span>
  <button type="button" id="install-go" hidden></button>
  <button type="button" id="install-x" aria-label="Dismiss">&times;</button>
</div>
<script>
(function(){
  var box = document.getElementById("install");
  var msgEl = document.getElementById("install-msg");
  var go = document.getElementById("install-go");
  var x = document.getElementById("install-x");

  var COPY = {
    en:{ ios:"To keep it on your phone: tap <b>Share</b>, then <b>Add to Home Screen</b>.",
         other:"Keep Slide Clock on your home screen.", go:"Install" },
    zh:{ ios:"要裝到手機上：點 <b>分享</b>，再選 <b>加入主畫面</b>。",
         other:"把 Slide Clock 放到你的主畫面。", go:"安裝" }
  };
  function lang(){
    try { return (localStorage.getItem("sc_lang") || (/^zh/i.test(navigator.language||"") ? "zh" : "en")); }
    catch(e){ return /^zh/i.test(navigator.language||"") ? "zh" : "en"; }
  }
  var deferred = null;
  var standalone = (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches)
                   || window.navigator.standalone === true;
  var ios = /iPad|iPhone|iPod/.test(navigator.userAgent)
            || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  var dismissed = false;
  try { dismissed = localStorage.getItem("sc_install_hint") === "off"; } catch(e){}

  function paint(){
    var c = COPY[lang()] || COPY.en;
    msgEl.innerHTML = deferred ? c.other : c.ios;
    go.textContent = c.go;
    go.hidden = !deferred;
  }
  function show(){ if (!standalone && !dismissed){ box.hidden = false; paint(); } }

  /* Android and desktop Chrome offer a real install; iOS has no prompt of
     its own, so there the page has to say where the button is. */
  window.addEventListener("beforeinstallprompt", function(e){
    e.preventDefault();
    deferred = e;
    show();
  });
  if (ios) show();

  go.onclick = function(){
    if (!deferred) return;
    deferred.prompt();
    deferred.userChoice.then(function(){ deferred = null; box.hidden = true; });
  };
  x.onclick = function(){
    box.hidden = true;
    try { localStorage.setItem("sc_install_hint","off"); } catch(e){}
  };
  window.addEventListener("appinstalled", function(){ box.hidden = true; });
  document.addEventListener("sc:lang", paint);
})();
if ("serviceWorker" in navigator){
  /* Cache-first means an installed copy keeps serving the old shell. When a
     new worker takes over, reload once so the update actually lands instead
     of waiting for the user to guess they should close the app twice. */
  var hadController = !!navigator.serviceWorker.controller, refreshing = false;
  navigator.serviceWorker.addEventListener("controllerchange", function(){
    if (!hadController || refreshing) return;   /* first install: nothing stale on screen */
    refreshing = true;
    location.reload();
  });
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").then(function(reg){
      reg.update();
      setInterval(function(){ reg.update(); }, 60 * 60 * 1000);
    }).catch(function(){});
  });
}
</script>
